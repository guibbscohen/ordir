name: Turn scripts

# Cheap Linux checks on every push: every citation's excerpt is on its cited PDF page and every
# picture has its asset, and the browser preview, built from the same data, plays through in
# Chromium with accessibility checks. The macOS jobs cost 10x the minutes, so they run less often.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: turn-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Keep the downloaded rulebooks between runs
        uses: actions/cache@v4
        with:
          path: Sources/**/*.pdf
          key: sources-${{ hashFiles('Ordir/Games/**/*.turnscript.json') }}
          restore-keys: sources-

      - name: Validate turn scripts against the official PDFs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pypdf cryptography fonttools
          .venv/bin/python -u tools/fetch_sources.py
          .venv/bin/python tools/validate_turn_scripts.py

      - name: Check every screen text has its translations
        run: python3 tools/check_strings.py

  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Build the browser preview and play it in Chromium
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet playwright==1.63.0 axe-playwright-python==0.1.8
          .venv/bin/python -m playwright install --with-deps chromium
          .venv/bin/python tools/build_preview.py
          .venv/bin/python tools/test_preview.py
