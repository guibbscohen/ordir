name: iOS build

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate turn scripts against the official PDFs
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pypdf
          .venv/bin/python tools/validate_turn_scripts.py

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project Ordir.xcodeproj \
            -scheme Ordir \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Launch and capture screenshots
        run: |
          UDID=${{ steps.sim.outputs.udid }}
          mkdir -p screenshots
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/Ordir.app
          xcrun simctl launch "$UDID" com.guibbscohen.ordir
          sleep 8
          xcrun simctl io "$UDID" screenshot screenshots/home.png
          xcrun simctl io "$UDID" recordVideo --codec h264 screenshots/home.mp4 &
          REC=$!
          sleep 6
          kill -INT $REC
          wait $REC || true
          # Dune guide: the expansion picker, a step for both players, then an Atreides turn with
          # every expansion on (expansion additions on the near half).
          shot() {
            xcrun simctl terminate "$UDID" com.guibbscohen.ordir || true
            xcrun simctl launch "$UDID" com.guibbscohen.ordir -OrdirOpenGame duneWarForArrakis "${@:2}"
            sleep 5
            xcrun simctl io "$UDID" screenshot "screenshots/dune-$1.png"
          }
          shot expansions
          shot setup-board -OrdirStartStep setup-board
          shot turn-atreides -OrdirStartStep turn-atreides -OrdirExpansions desertWar,smugglers,spacingGuild

      - name: Upload build log and screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ordir-simulator
          path: |
            build.log
            screenshots/
          if-no-files-found: ignore
