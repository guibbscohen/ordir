name: iOS walkthrough

# On demand only (Actions tab → iOS walkthrough → Run workflow): taps through the whole guide in
# the simulator and uploads screenshots of every step. Slow on macOS runners, which cost 10x.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Tests to run, e.g. OrdirUITests/AccessibilityAuditTests (default: all UI tests)"
        default: "OrdirUITests"

concurrency:
  group: ios-walkthrough-${{ github.ref }}
  cancel-in-progress: true

jobs:
  walkthrough:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, ds in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")))')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          # Boot now so the first test's app launch doesn't time out on a cold simulator.
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Run the UI tap-through with screenshots
        timeout-minutes: 35
        run: |
          set -o pipefail
          mkdir -p screenshots
          TEST_RUNNER_SCREENSHOT_DIR="$PWD/screenshots" xcodebuild test \
            -project Ordir.xcodeproj \
            -scheme Ordir \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -only-testing:"${{ inputs.tests }}" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee test.log | grep -E "Test Case .*(passed|failed)|error:|Executed|\*\* TEST" || true
          grep -q "\*\* TEST SUCCEEDED \*\*" test.log

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ordir-walkthrough
          path: |
            test.log
            screenshots/
          if-no-files-found: ignore
