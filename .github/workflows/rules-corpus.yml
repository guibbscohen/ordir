name: Rules corpus

# On demand (Actions tab → Rules corpus → Run workflow): downloads the official PDFs, checks their
# SHA-256, extracts each page and replaces the pages in Supabase's rules_pages table, which the
# rules-answer Edge Function reads. Run it after a source PDF or a game's sources change.
# Needs the repository secret SUPABASE_DB_URL (Supabase → Project Settings → Database → Connection
# string, URI with the password filled in).
on:
  workflow_dispatch:

concurrency:
  group: rules-corpus
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Keep the downloaded rulebooks between runs
        uses: actions/cache@v4
        with:
          path: Sources/**/*.pdf
          key: sources-${{ hashFiles('Ordir/Games/**/*.turnscript.json') }}
          restore-keys: sources-

      - name: Extract the official sources page by page
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet pypdf cryptography fonttools
          .venv/bin/python -u tools/fetch_sources.py
          .venv/bin/python tools/rules_corpus.py

      - name: Replace the pages in Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          test -n "$SUPABASE_DB_URL" || { echo "::error::Add the SUPABASE_DB_URL repository secret first."; exit 1; }
          for file in build/rules_corpus/*.sql; do
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -q -f "$file"
          done
          psql "$SUPABASE_DB_URL" -c "select game, source, count(*) as pages from public.rules_pages group by 1, 2 order by 1, 2"
